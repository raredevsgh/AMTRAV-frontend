# Required checks for the AMTRAV frontends. Mark every job as required in
# branch protection.
name: frontend

on:
  # No path filter: required checks must report on every pull request.
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:landing
      - run: pnpm lint:admin

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:landing
      - run: pnpm build:admin

  secrets:
    # Server-side backstop for .githooks/pre-commit: cannot be skipped locally.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the latest
      - name: No secret files tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..+)?|[^/]+\.(pem|key|p12|pfx|jks|keystore)|id_(rsa|dsa|ecdsa|ed25519)[^/]*)$' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::Secret files are tracked (listed above). Remove them and rotate any exposed credentials."
            exit 1
          fi
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'
