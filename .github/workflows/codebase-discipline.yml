# Codebase discipline checks (AGENTS.md, "Codebase discipline").
# - dependencies (blocking): a pull request that changes pnpm-lock.yaml must explain
#   why in the "## Dependencies" section of its description. CI installs with
#   --frozen-lockfile, so every dependency change touches the lockfile.
name: codebase-discipline

on:
  pull_request:
    # "edited" re-runs the dependencies check when the description is updated.
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff needs the merge base
      - name: Dependency changes are justified
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ] || git diff --quiet "$BASE...$HEAD" -- pnpm-lock.yaml; then
            exit 0
          fi
          # Text under "## Dependencies" up to the next heading, without HTML comments.
          reason=$(printf '%s\n' "$BODY" | tr -d '\r' | sed 's/<!--.*-->//g' \
            | awk '/^## /{on = /^## Dependencies/; next} on' | tr -d '[:space:]')
          if [ -z "$reason" ]; then
            echo "::error::pnpm-lock.yaml changed. Explain what was added or upgraded, and why, in the \"## Dependencies\" section of the pull request description."
            exit 1
          fi
