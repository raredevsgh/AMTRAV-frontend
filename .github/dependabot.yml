# Weekly dependency update PRs. Each PR must pass the required lint and build
# checks before it can merge.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directories:
      - "/"
      - "/landing_page"
      - "/admin_panel"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch updates; majors arrive separately for review
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next.js, React and their types move together; upgrade majors deliberately
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
