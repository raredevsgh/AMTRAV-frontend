# Weekly dependency update PRs. Each PR must pass the required lint, build and
# secrets checks before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    # The workspace root covers every package in pnpm-workspace.yaml through the
    # single pnpm-lock.yaml. Listing the app folders as well duplicates every PR.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Safe updates: one PR per week
      minor-and-patch:
        update-types: [minor, patch]
      # Breaking updates: one PR to review and test deliberately before merging
      major-upgrades:
        update-types: [major]
    ignore:
      # @types/node must match the pinned Node.js major (.nvmrc: 24)
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Framework majors are planned upgrades, not weekly maintenance
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
