# AMTRAV Frontend Sprint Definitions (authoritative for the sprint automation).
# Operational state (issues, activation, completion) lives in GitHub Issues,
# never in this file. Change this file only through reviewed pull requests.

schema_version = 1
repository = "raredevsgh/AMTRAV-frontend"
default_branch = "main"
bot_login = "github-actions[bot]"
approvers = ["raredevsgh"]
activation_agreements = 2

[[decision]]
id = "FD1"
summary = "Adopt Tailwind CSS v4 token conventions with CSS variables and Geist font across admin_panel"
why = "Establishes unified design system foundation and prevents conflicting ad-hoc styling"
blocks = "Sprint F1, Sprint F2"
safe_meanwhile = "Sprint F0 contracts and DTO schema definition"

[[decision]]
id = "FD2"
summary = "Adopt typed API client with TanStack React Query for data fetching, caching, and optimistic mutations"
why = "Ensures predictable server-state management, cache invalidation, and decoupling from UI components"
blocks = "Sprint F2, Sprint F3, Sprint F4, Sprint F5"
safe_meanwhile = "Sprint F0 and Sprint F1 primitive component creation"

[[decision]]
id = "FD3"
summary = "Adopt typed in-memory mock fixtures with simulated network latency for decoupled frontend iteration"
why = "Allows full UI development, testing, and UX validation before Axum backend deployment"
blocks = "Sprint F2 item 1"
safe_meanwhile = "Sprint F0 contracts"

[[decision]]
id = "FD4"
summary = "Define session and authentication token transport (HttpOnly cookie with CSRF header)"
why = "Required for backend security boundary and authenticated route gates"
blocks = "Sprint F5"
safe_meanwhile = "Sprint F0 to F4 with mocked session context"

[[sprint]]
id = "sprint-f0"
title = "Frontend Contracts, Schema Types & Root App Shell"
order = 0
kind = "foundation"
next = "sprint-f1"
risk_level = 1
assignees = ["raredevsgh", "Anapey01"]
objective = "Establish TypeScript contracts matching Axum backend DTOs, typed mock client adapters, and initialize the responsive Root App Shell with navigation routes for the 5 MVP domains."
starting_state = "Fresh pnpm monorepo with default Next.js starter templates."
dependencies = "None."
risk = "Low risk; contracts and UI layout foundation only."
deliverables = "TypeScript contract definitions, mock fixture handlers, responsive App Shell (Sidebar, Header, Layout), and route skeletons."
exit_gate = "App Shell renders cleanly on desktop and tablet; all 5 MVP routes navigate without errors; lint:admin and build:admin pass."
effort = "1 week."
blocked_by = []
acceptance_criteria = [
  "Strict TypeScript types defined for Manufacturer, Batch, StockMovement, SalesRepCustody, and SalesTransaction matching backend Axum schemas.",
  "Typed mock data service layer providing fixture data for all 5 MVP domain views.",
  "Responsive App Shell with collapsible SidebarNav, GlobalHeader, and user profile badge.",
  "Route skeletons wired for /dashboard, /manufacturers, /sales, /inventory, and /finance with active route highlights.",
  "pnpm lint:admin and pnpm build:admin pass with zero warnings.",
]
checks_required = true
required_checks = ["lint", "build", "secrets"]
required_prs = []

[[sprint.task]]
key = "F0-1"
title = "Define TypeScript schemas and DTO types matching Rust backend API contracts (ManufacturerDto, BatchDto, StockMovementDto, SalesRepCustodyDto, TransactionDto)."
required = true

[[sprint.task]]
key = "F0-2"
title = "Create typed mock client adapter and fixture data handlers so UI views run completely decoupled from backend service availability."
required = true

[[sprint.task]]
key = "F0-3"
title = "Build responsive Root App Shell with collapsible sidebar (SidebarNav), top navigation bar (GlobalHeader), route layout, and mock tenant/auth context."
required = true

[[sprint.task]]
key = "F0-4"
title = "Wire route skeletons for /dashboard, /manufacturers, /sales, /inventory, and /finance with breadcrumb navigation and metadata."
required = true

