# AMTRAV Frontend Sprint Definitions (authoritative for the sprint automation).
# Operational state (issues, activation, completion) lives in GitHub Issues,
# never in this file. Change this file only through reviewed pull requests.
#
# The admin panel is planned against the backend API contract published at
# https://dev.amortrav.com/swagger-ui/ (OpenAPI: /api/v1/openapi.json).

schema_version = 1
repository = "raredevsgh/AMTRAV-frontend"
default_branch = "main"
bot_login = "github-actions[bot]"
approvers = ["raredevsgh"]
activation_agreements = 2

[[decision]]
id = "FD1"
summary = "Admin panel visual design: reuse the AMORTRAV tokens and components from landing_page, or provide a dedicated admin design"
why = "Keeps the two apps consistent and avoids ad-hoc styling in admin_panel"
blocks = "Sprint F2 styling"
safe_meanwhile = "Sprint F0 and Sprint F1"

[[decision]]
id = "FD2"
summary = "Server-state approach: TanStack Query in client components, or Next.js server components and route handlers"
why = "Determines caching, refetching and mutation patterns for every data view"
blocks = "Sprint F3, Sprint F4"
safe_meanwhile = "Sprint F0 to F2"

[[decision]]
id = "FD3"
summary = "Typed mock fixtures that return the real API DTOs for development without a backend"
why = "Allows UI work to continue when dev.amortrav.com is unavailable"
blocks = "Sprint F0 item 2"
safe_meanwhile = "Sprint F0 contracts"

[[decision]]
id = "FD4"
summary = "Session handling: the Next.js server keeps the access and refresh tokens in HttpOnly, Secure, SameSite=Strict cookies and proxies /api/v1"
why = "The API returns tokens in JSON and has no CORS, so the browser cannot call it cross-origin or hold tokens safely"
blocks = "Sprint F1"
safe_meanwhile = "Sprint F0 with a mocked session"

[[decision]]
id = "FD5"
summary = "Admin panel audience: administrators only, or administrators and manufacturers"
why = "The API serves both staff roles with different scopes; the navigation and route gates depend on it"
blocks = "Sprint F1 item 4"
safe_meanwhile = "Role-aware shell for both roles"

[[sprint]]
id = "sprint-f0"
title = "API Contracts, Mock Data & Root App Shell"
order = 0
kind = "foundation"
next = "sprint-f1"
risk_level = 1
assignees = ["raredevsgh", "Anapey01"]
objective = "Define TypeScript types that match the backend API contract, provide typed mock data, and build the role-aware App Shell with the admin routes."
starting_state = "admin_panel is the default Next.js starter; the backend API is live at dev.amortrav.com."
dependencies = "None."
risk = "Low risk; contracts and UI layout only, no live calls."
deliverables = "API types, mock fixtures, responsive App Shell and route skeletons."
exit_gate = "App Shell renders on desktop and mobile; all routes navigate without errors; lint:admin and build:admin pass."
effort = "1 week."
blocked_by = []
acceptance_criteria = [
  "Types for User, Role, TokenPair, Credentials, Device, ProvisionedDevice, RegisterDevice, UpdateDevice, DeviceAudit, FileMetadata, JobReceipt, JobResult, ManufacturerResponse, RoleUpdate and ErrorResponse match /api/v1/openapi.json.",
  "Mock fixtures return those DTOs, paginate with limit and offset, and use the API error envelope.",
  "App Shell shows the signed-in user and role; navigation shows only the sections the role can use.",
  "Routes /login, /devices, /devices/[id], /users and /files exist with breadcrumbs and metadata.",
  "pnpm lint:admin and pnpm build:admin pass with zero warnings.",
]
checks_required = true
required_checks = ["lint", "build", "secrets"]
required_prs = []

[[sprint.task]]
key = "F0-1"
title = "Define TypeScript types matching the backend OpenAPI contract (/api/v1/openapi.json): User, Role, TokenPair, Credentials, Device, ProvisionedDevice, RegisterDevice, UpdateDevice, DeviceAudit, FileMetadata, JobReceipt, JobResult, ManufacturerResponse, RoleUpdate, ErrorResponse."
required = true

[[sprint.task]]
key = "F0-2"
title = "Create typed mock fixtures that return those DTOs, paginate with limit and offset, and use the API error envelope, so views run without a backend."
required = true

[[sprint.task]]
key = "F0-3"
title = "Build the responsive App Shell: sidebar, header with the signed-in user and role badge, and role-aware navigation (administrator: Devices, Users, Files; manufacturer: Devices, Files)."
required = true

[[sprint.task]]
key = "F0-4"
title = "Wire route skeletons for /login, /devices, /devices/[id], /users and /files with breadcrumbs and metadata."
required = true

[[sprint]]
id = "sprint-f1"
title = "Staff Authentication & Same-Origin API Proxy"
order = 1
kind = "integration"
next = "sprint-f2"
risk_level = 3
assignees = ["raredevsgh", "Anapey01"]
objective = "Sign staff in with the API, keep their session on the Next.js server, and reach the API through a same-origin proxy."
starting_state = "Sprint F0 completed; FD4 decided."
dependencies = "Sprint F0; FD4 and FD5."
risk = "High risk (Level 3); credentials, session tokens and the security boundary to the API."
deliverables = "API proxy route, login page, session refresh and logout, route protection."
exit_gate = "A manufacturer and an administrator can sign in, stay signed in across token refresh, and sign out, against dev.amortrav.com."
effort = "1.5 weeks."
blocked_by = ["FD4"]
acceptance_criteria = [
  "The browser never receives or stores the access or refresh token; both live in HttpOnly cookies set by the Next.js server.",
  "All API calls go through the same-origin proxy, which adds the Bearer token server-side.",
  "Login shows one generic error for unknown accounts, wrong passwords and mobile accounts, and honours Retry-After on 429.",
  "Concurrent requests trigger at most one refresh; both returned tokens replace the old pair.",
  "Unauthenticated visitors are sent to /login; users with the user role cannot enter; manufacturers cannot open administrator routes.",
]
checks_required = true
required_checks = ["lint", "build", "secrets"]
required_prs = []

[[sprint.task]]
key = "F1-1"
title = "Add a same-origin proxy (Next.js route handler) that forwards /api/v1 requests to the API base URL from server configuration and adds the Bearer token from the HttpOnly cookie (the API has no CORS)."
required = true

[[sprint.task]]
key = "F1-2"
title = "Build the login page: POST /api/v1/auth/login with email and password; one generic error for any 401; on 429 tell the user to retry after the Retry-After delay."
required = true

[[sprint.task]]
key = "F1-3"
title = "Implement the session lifecycle: store the TokenPair in HttpOnly cookies, rotate with POST /api/v1/auth/refresh (single-flight, replace both tokens), and sign out with POST /api/v1/auth/logout."
required = true

[[sprint.task]]
key = "F1-4"
title = "Protect routes: load GET /api/v1/auth/me, redirect anonymous visitors to /login, refuse the user role, and show a 403 page to manufacturers on administrator routes."
required = true

[[sprint]]
id = "sprint-f2"
title = "Core Reusable UI Primitives"
order = 2
kind = "design-system"
next = "sprint-f3"
risk_level = 1
assignees = ["raredevsgh", "Anapey01"]
objective = "Build the reusable components every admin view needs, shaped by how the API pages, reports state and returns errors."
starting_state = "Sprint F1 completed; FD1 decided."
dependencies = "Sprint F1; FD1."
risk = "Low risk; isolated UI components."
deliverables = "DataTable, StatusBadge, RoleBadge, ModalShell, ConfirmDialog, form error handling and a one-time secret reveal."
exit_gate = "Primitives are used by at least one route and documented in the code."
effort = "1 week."
blocked_by = ["FD1"]
acceptance_criteria = [
  "DataTable pages with limit and offset using previous and next controls (the API returns no total count) and has loading and empty states.",
  "StatusBadge renders the device states registered, claimed and revoked; RoleBadge renders user, manufacturer and admin.",
  "ModalShell and ConfirmDialog trap focus, close on Escape and label irreversible actions.",
  "Form errors show the API error message; 400, 409 and 422 appear inline, 429 asks to retry and 503 shows a generic message.",
  "The one-time secret reveal supports copy and print and states that the value will not be shown again.",
]
checks_required = true
required_checks = ["lint", "build", "secrets"]
required_prs = []

[[sprint.task]]
key = "F2-1"
title = "Build a DataTable with limit and offset pagination (previous and next; the API returns no total count), loading and empty states."
required = true

[[sprint.task]]
key = "F2-2"
title = "Build StatusBadge for device status (registered, claimed, revoked) and RoleBadge for user roles (user, manufacturer, admin)."
required = true

[[sprint.task]]
key = "F2-3"
title = "Build ModalShell and ConfirmDialog with focus trap, Escape to close and clear wording for irreversible actions."
required = true

[[sprint.task]]
key = "F2-4"
title = "Build form fields and API error handling for the error envelope: 400, 409 and 422 inline, 429 retry, 503 generic."
required = true

[[sprint.task]]
key = "F2-5"
title = "Build a one-time secret reveal (copy, print, will not be shown again) for device claim codes."
required = true

[[sprint]]
id = "sprint-f3"
title = "Device Registry"
order = 3
kind = "feature"
next = "sprint-f4"
risk_level = 2
assignees = ["raredevsgh", "Anapey01"]
objective = "Let manufacturers manage their device inventory and administrators manage every device, using the device registry API."
starting_state = "Sprint F2 completed; FD2 decided."
dependencies = "Sprint F2; FD2."
risk = "Moderate risk; one-time claim codes and irreversible revocation."
deliverables = "Device list, registration with claim code reveal, device detail and edit, claim code rotation, revocation and audit history."
exit_gate = "A manufacturer can register a device, hand over its claim code, edit it, rotate the code while unclaimed, revoke it and read its audit history."
effort = "1.5 weeks."
blocked_by = ["FD2"]
acceptance_criteria = [
  "The device list pages through GET /api/v1/devices; administrators see every device and manufacturers only their own.",
  "Registration shows the returned claim code once, and a duplicate serial number shows the 409 message.",
  "Model and firmware version can be edited; the firmware version is labelled as declared metadata, not live device state.",
  "Claim code rotation is offered only for unclaimed devices; revocation asks for confirmation and states that it does not lock or wipe the bag.",
  "The audit history pages through GET /api/v1/devices/{id}/audit.",
]
checks_required = true
required_checks = ["lint", "build", "secrets"]
required_prs = []

[[sprint.task]]
key = "F3-1"
title = "Implement the device list on /devices with GET /api/v1/devices (limit, offset); administrators see all devices, manufacturers their own inventory."
required = true

[[sprint.task]]
key = "F3-2"
title = "Implement device registration with POST /api/v1/devices (serial_number, model, firmware_version; administrators also choose manufacturer_id) and reveal the returned claim_code once."
required = true

[[sprint.task]]
key = "F3-3"
title = "Implement the device detail page /devices/[id] with GET /api/v1/devices/{id} and editing of model and firmware_version with PATCH."
required = true

[[sprint.task]]
key = "F3-4"
title = "Implement claim code rotation (POST /api/v1/devices/{id}/claim-code, unclaimed devices only) and revocation (POST /api/v1/devices/{id}/revoke) with confirmation."
required = true

[[sprint.task]]
key = "F3-5"
title = "Implement the audit history with GET /api/v1/devices/{id}/audit (limit, offset)."
required = true

[[sprint]]
id = "sprint-f4"
title = "Administration & Private Files"
order = 4
kind = "feature"
next = "sprint-f5"
risk_level = 2
assignees = ["raredevsgh", "Anapey01"]
objective = "Let administrators manage accounts and manufacturers, and let staff keep private files, using the administration and files APIs."
starting_state = "Sprint F3 completed."
dependencies = "Sprint F3."
risk = "Moderate risk; role changes invalidate sessions and manufacturer creation is asynchronous."
deliverables = "User list, role change, manufacturer creation with job polling, and the files area."
exit_gate = "An administrator can create a manufacturer and change roles; staff can upload, list and download their files."
effort = "1.5 weeks."
blocked_by = []
acceptance_criteria = [
  "The user list pages through GET /api/v1/admin/users and is visible to administrators only.",
  "Role changes explain that the user is signed out everywhere; administrators cannot change their own role and Google accounts stay users.",
  "Manufacturer creation polls the job with the X-Job-Receipt header (never in the URL), respects poll_after_ms, shows the final http_status and handles an expired job (410).",
  "File upload sends raw bytes with an X-File-Name of letters, digits, spaces, dots, hyphens and underscores, up to 10 MiB.",
  "Files can be listed, inspected and downloaded.",
]
checks_required = true
required_checks = ["lint", "build", "secrets"]
required_prs = []

[[sprint.task]]
key = "F4-1"
title = "Implement the user list on /users with GET /api/v1/admin/users (limit, offset) and role badges, for administrators only."
required = true

[[sprint.task]]
key = "F4-2"
title = "Implement role changes with PATCH /api/v1/admin/users/{id}/role, explaining that the user is signed out everywhere, that you cannot change your own role and that Google accounts stay users."
required = true

[[sprint.task]]
key = "F4-3"
title = "Implement manufacturer creation with POST /api/v1/admin/manufacturers (email, 12 to 128 byte password): poll GET /api/v1/auth/jobs/{id} with the X-Job-Receipt header and show the outcome, including an expired job (410)."
required = true

[[sprint.task]]
key = "F4-4"
title = "Implement /files: list (GET /api/v1/files), upload raw bytes (POST with X-File-Name, up to 10 MiB), metadata and download."
required = true

